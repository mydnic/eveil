services:
  eveil:
    build: .
    container_name: eveil
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
    volumes:
      - ./data:/var/www/html/storage/app
